# Publica el sitio en GitHub Pages, servido en el dominio propio.
#
# Por qué GitHub Pages y no Cloudflare Pages, que era el plan: el dominio se
# registró en Wix el 26/07/2026 y las reglas de ICANN lo dejan intransferible
# hasta el 24/09 —el día que arranca el festival—. Wix tampoco deja cambiar los
# nameservers, así que el DNS se queda ahí de momento; y Cloudflare Pages no
# puede servir el dominio raíz si el DNS no vive en Cloudflare. GitHub Pages sí,
# con registros A. Cuando el dominio salga de Wix esto se puede revisar: el
# `public/_redirects` ya está escrito esperando ese día.
#
# El sitio se construye desde `main` y sin `PAGES_BASE`: cuelga de la raíz del
# dominio, no de un subdirectorio. `public/CNAME` es lo que le dice a GitHub qué
# dominio servir, y con él la redirección del dominio pelado a `www` la hace
# GitHub solo.
#
# Se dispara de tres formas: al empujar a `main`, a mano desde la pestaña de
# Actions, y por `repository_dispatch` — que es como el Worker del panel publica
# cuando alguien guarda algo en /admin.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [publicar]

# `contents: write` es para el respaldo del contenido, abajo: el job comitea la
# instantánea que se acaba de publicar. Lo demás es lo que pide Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Baja el contenido del panel y construye. Si el Worker no contesta, usa
      # la copia comiteada y sigue: ver scripts/instantanea.mjs.
      #
      # Las dos variables salen de la configuración del repositorio y casi
      # siempre están vacías, que es como se construye producción. Sólo se
      # rellenan mientras el dominio todavía no apunta aquí y Pages sirve el
      # sitio desde `/festival-cuarta-silla/`: sin ellas se vería sin estilos.
      # Ver el comentario de `astro.config.mjs`.
      - run: npm run build
        env:
          PAGES_SITE: ${{ vars.PAGES_SITE }}
          PAGES_BASE: ${{ vars.PAGES_BASE }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # El contenido que se acaba de publicar, guardado en el repositorio.
      #
      # KV es la fuente, pero sólo conserva las últimas veinte versiones: la
      # copia comiteada llegó a estar dieciocho guardados por detrás, a un paso
      # de salirse de esa ventana. Esto deja el histórico del contenido en git
      # —que es lo que `scripts/instantanea.mjs` dice que quiere ser— y de paso
      # da de dónde reconstruir si el panel se cae o se vacía.
      #
      # Va después de subir el artefacto y con `continue-on-error`: es un
      # respaldo, y un respaldo no puede impedir que el sitio se publique.
      #
      # No dispara otro build: GitHub no lanza workflows con los push hechos
      # con `GITHUB_TOKEN`. El `[skip ci]` está para quien lea el histórico.
      - name: Respaldar el contenido
        continue-on-error: true
        run: |
          if git diff --quiet -- src/data/contenido.json; then
            echo "El contenido no cambió desde el último build."
            exit 0
          fi
          version=$(node -p "require('./src/data/contenido.json').version")
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/contenido.json
          git commit -m "contenido: instantánea del panel (versión $version) [skip ci]"
          # Alguien pudo empujar mientras se construía: el respaldo se pone
          # detrás de lo que haya en vez de pelearse por la punta de la rama.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
